<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freshman Schedule - Fall 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f7f9fc;--card:#ffffff;--ink:#1f2937;--mute:#667085;--line:#e3e8ef;--accent:#2f6fb0;--chipbg:#eaf1f9;
--lec:#f6b98f;--lecbg:#fff4ec;--tut:#9db8e6;--tutbg:#f0f5fd;--lab:#8cc26a;--labbg:#f1f9ec;--mix:#bdbdbd;--mixbg:#f5f5f5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",Segoe UI,Tahoma,Arial,sans-serif;line-height:1.5}
.hero{background:linear-gradient(135deg,#e6f0fb 0%,#f4f8fd 60%,#fdf8ec 100%);border-bottom:1px solid var(--line);position:relative}
.hero::after{content:"";display:block;height:4px;background:linear-gradient(90deg,#b8902f,#e6c76e,#b8902f)}
.hero-in{max-width:760px;margin:0 auto;padding:26px 16px 22px}
.ht{min-width:0}
h1{font-size:1.9rem;line-height:1.15;margin:0;font-weight:700;color:#1d3557;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.term{font-size:.85rem;font-weight:600;color:#7a5a12;background:#fbf1d3;border:1px solid #e3c874;border-radius:999px;padding:2px 12px}
.uni{margin-top:6px;font-weight:600;color:#33506f;font-size:1rem}
.fac{color:var(--mute);font-size:.92rem}
.week{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.week span{font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:6px;background:#fff;border:1px solid #cfdcec;color:#33506f}
.week span.off{background:transparent;border-style:dashed;color:#9aa7b8;font-weight:400}
@media (max-width:480px){h1{font-size:1.55rem}}
.picker{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.picker-in{max-width:760px;margin:0 auto}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.lbl{font-weight:600;font-size:.85rem;color:var(--mute);min-width:70px}
button.chip{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--chipbg);color:var(--ink);border-radius:8px;padding:5px 11px;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:14px 16px 20px}
.gtitle{font-size:1.25rem;font-weight:700;margin:6px 0 10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.day h3{margin:0;padding:8px 14px;font-size:1rem;background:var(--chipbg);border-bottom:1px solid var(--line)}
.empty{padding:10px 14px;color:var(--mute);font-size:.92rem}
.s{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:10px 14px;border-left:5px solid var(--line);border-bottom:1px solid var(--line)}
.s:last-child{border-bottom:0}
.s.Lecture{border-left-color:var(--lec);background:var(--lecbg)}
.s.Tut{border-left-color:var(--tut);background:var(--tutbg)}
.s.Lab{border-left-color:var(--lab);background:var(--labbg)}
.s.Mix{border-left-color:var(--mix);background:var(--mixbg)}
.t{font-weight:600;font-size:.95rem}
.t small{display:block;color:var(--mute);font-weight:400;font-size:.8rem}
.c{font-weight:600}
.m{color:var(--mute);font-size:.9rem;margin-top:2px}
.m b{color:var(--ink);font-weight:600}
.sep{height:22px}
@media (max-width:480px){.s{grid-template-columns:128px 1fr}}
footer{background:linear-gradient(135deg,#e6f0fb 0%,#f4f8fd 60%,#fdf8ec 100%);border-top:4px solid #d9b75c;text-align:center;padding:20px 16px;color:#33506f;font-size:.95rem}
footer b{color:#1d3557;font-weight:700}
footer span{color:#7a5a12;font-weight:600}
@media (max-width:700px){.picker{position:static}}
@media print{.picker{display:none}body{background:#fff}.day{break-inside:avoid}}
</style>
</head>

const DAYS=["Saturday","Sunday","Monday","Tuesday","Wednesday","Thursday"];
const NAMES=[];for(let i=1;i<=12;i++)NAMES.push("GA-"+i);for(let i=1;i<=9;i++)NAMES.push("GB-"+i);
const TYPE={"Lecture":"Lecture","Tut":"Tutorial","Lab":"Lab","Tut + Lab":"Tutorial + Lab"};
const CLS={"Lecture":"Lecture","Tut":"Tut","Lab":"Lab","Tut + Lab":"Mix"};
function fmt(min){let h=Math.floor(min/60),m=min%60;const ap=h<12?"AM":"PM";let h12=h%12===0?12:h%12;return h12+":"+String(m).padStart(2,"0")+" "+ap}
function dur(n){return n+(n===1?" hour":" hours")}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function groupHTML(g){
  let h='<div class="gtitle">'+NAMES[g]+'</div>';
  for(const d of DAYS){
    const rs=DATA.filter(r=>r.day===d&&r.c0<=g&&g<r.c1).sort((a,b)=>a.p0-b.p0);
    h+='<section class="day"><h3>'+d+'</h3>';
    if(!rs.length)h+='<div class="empty">No classes</div>';
    for(const r of rs){
      const s=fmt(8*60+30+(r.p0-1)*60),e=fmt(8*60+30+r.p1*60),n=r.p1-r.p0+1;
      h+='<div class="s '+CLS[r.type]+'"><div class="t">'+s+' - '+e+'<small>'+dur(n)+'</small></div><div><div class="c">'+TYPE[r.type]+' - '+esc(r.code)+' '+esc(r.course)+'</div><div class="m">Room: <b>'+esc(r.room)+'</b>'+(r.staff?' - '+esc(r.staff):'')+'</div></div></div>';
    }
    h+='</section>';
  }
  return h;
}
let cur=0,all=false;
function render(){
  document.getElementById("out").innerHTML=all?NAMES.map((_,g)=>groupHTML(g)).join('<div class="sep"></div>'):groupHTML(cur);
  document.querySelectorAll("button.chip[data-g]").forEach(b=>b.setAttribute("aria-pressed",(!all&&+b.dataset.g===cur)?"true":"false"));
  document.getElementById("allbtn").setAttribute("aria-pressed",all?"true":"false");
}
NAMES.forEach((n,i)=>{const b=document.createElement("button");b.className="chip";b.textContent=n;b.dataset.g=i;b.onclick=()=>{cur=i;all=false;render();window.scrollTo(0,0)};document.getElementById(i<12?"ga":"gb").appendChild(b)});
document.getElementById("allbtn").onclick=()=>{all=!all;render();window.scrollTo(0,0)};
